<div class="limiter">
    <div class="container-login100">
        <div class="wrap-login100">
            <form class="login100-form validate-form" id="new_password-form" action="verify_new_password.php" method="POST" onsubmit="return validatePasswords();">
                <span class="login100-form-title p-b-26">
                    New Password
                </span>
                <div class="wrap-input100 validate-input" data-validate="Enter new password">
                    <span class="btn-show-pass">
                         <i class="zmdi zmdi-eye"></i>
                    </span>
                    <input class="input100" type="password" id="password" name="password" placeholder="" required>
                    <span class="focus-input100" data-placeholder="New Password"></span>
                </div>
                <div class="wrap-input100 validate-input" data-validate="Re-enter password">
                    <span class="btn-show-pass">
                         <i class="zmdi zmdi-eye"></i>
                    </span>
                    <input class="input100" type="password" id="confirm-password" name="confirm-password" placeholder="" required>
                    <span class="focus-input100" data-placeholder="Confirm Password"></span>
                </div>
                <div class="container-login100-form-btn">
                    <div class="wrap-login100-form-btn">
                        <div class="login100-form-bgbtn"></div>
                        <button class="login100-form-btn" type="submit" name="submit" id="register">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
     function validatePasswords() {
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirm-password").value;

        if (password !== confirmPassword) {
            alert("Passwords do not match");
            return false;
        }
        return true;
    }
</script>
