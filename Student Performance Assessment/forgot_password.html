<style>
    .loader-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        display: none; /* Initially hide the loader */
    }

    .loader {
        width: fit-content;
        font-weight: bold;
        /* font-family: monospace; */
        font-size: 30px;
        clip-path: inset(0 3ch 0 0);
        animation: l5 1s steps(4) infinite;
    }

    .loader:before {
        content: "Sending . . .";
    }

    @keyframes l5 {
        to {
            clip-path: inset(0 -1ch 0 0);
        }
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(249, 248, 248);
        z-index: 9998;
        display: none; /* Initially hide the overlay */
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('forgot-password-form').addEventListener('submit', function() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
            document.body.style.overflow = 'hidden'; // Disable scrolling
            document.querySelectorAll('header, .container-login100').forEach(function(element) {
                element.style.display = 'none'; // Hide header and form
            });
        });
    });
</script>
